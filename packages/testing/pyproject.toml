[project]
name = "mmi-testing"
version = "0.1.0"
description = "Synthetic data generator and Siweb360 mock (test support only, never deployed)"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "openpyxl>=3.1", "python-multipart>=0.0.9", "mmi-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator", "src/siweb_mock", "src/dev_issuer", "src/seed_fixtures", "src/export_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
mmi-contracts = { workspace = true }
