server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (T038). Styles allow inline attributes because the SPA sets style props; scripts are same-origin only.
  # The two Google Fonts hosts are the only third parties; self-hosting the fonts would let them be removed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api-bff:8000;
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
