[project]
name = "mmi-inventory-service"
version = "0.1.0"
description = "Mundo Mascotix Intelligence - inventory-service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "azure-storage-queue>=12.9",
  "azure-storage-blob>=12.19",
  "azure-identity>=1.17",
  "mmi-contracts",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
mmi-contracts = { workspace = true }
