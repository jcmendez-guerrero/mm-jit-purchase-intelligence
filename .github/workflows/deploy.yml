name: deploy

# Deployment of all backend services, jobs and the SPA (T127, extending T139).
# Production needs a manual approval: configure required reviewers on the "production" environment.
# Images are pinned by sha256 digest. Azure identifiers come from repository/environment variables.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, production]
        default: test

permissions:
  id-token: write   # OIDC federation, no stored cloud credentials
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  services:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # "production" has required reviewers
    strategy:
      matrix:
        include:
          - name: siweb-connector
            type: job
            dockerfile: services/siweb-connector/Dockerfile
            app_var: CONNECTOR_JOB_NAME
          - name: siweb-cost-writer
            type: job
            dockerfile: services/siweb-cost-writer/Dockerfile
            app_var: COST_WRITER_JOB_NAME
          - name: inventory-service
            type: app
            dockerfile: services/inventory-service/Dockerfile
            app_var: INVENTORY_APP_NAME
          - name: forecast-service
            type: app
            dockerfile: services/forecast-service/Dockerfile
            app_var: FORECAST_APP_NAME
          - name: procurement-service
            type: app
            dockerfile: services/procurement-service/Dockerfile
            app_var: PROCUREMENT_APP_NAME
          - name: api-bff
            type: app
            dockerfile: services/api-bff/Dockerfile
            app_var: BFF_APP_NAME
          - name: web
            type: app
            dockerfile: apps/web/Dockerfile
            app_var: WEB_APP_NAME

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image, capture digest
        id: build
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMMIT: ${{ github.sha }}
        run: |
          az acr login --name "$ACR_NAME"
          image="$ACR_NAME.azurecr.io/mmi/$IMAGE_NAME"
          docker build -f "$DOCKERFILE" -t "$image:$COMMIT" .
          docker push "$image:$COMMIT"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$COMMIT")
          echo "ref=$digest" >> "$GITHUB_OUTPUT"

      - name: Update Container App Job (${{ matrix.name }})
        if: matrix.type == 'job'
        env:
          APP_NAME: ${{ vars[matrix.app_var] }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          if [ -n "$APP_NAME" ]; then
            az containerapp job update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_REF"
          fi

      - name: Update Container App (${{ matrix.name }})
        if: matrix.type == 'app'
        env:
          APP_NAME: ${{ vars[matrix.app_var] }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          if [ -n "$APP_NAME" ]; then
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_REF"
          fi
